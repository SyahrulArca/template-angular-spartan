<div class="flex flex-col items-center gap-3 p-4 px-8">
  <div
    class="flex size-20 items-center justify-center rounded-full border-2"
    [class]="iconShellClass()"
  >
    @switch (type()) {
      @case ('success') {
        <i-circle-check [size]="56" [animate]="true" [class]="iconClass()" />
      }
      @case ('error') {
        <i-octagon-alert [size]="56" [animate]="true" [class]="iconClass()" />
      }
      @case ('warning') {
        <i-triangle-alert [size]="56" [animate]="true" [class]="iconClass()" />
      }
      @case ('info') {
        <i-circle-question-mark [size]="56" [animate]="true" [class]="iconClass()" />
      }
    }
  </div>

  <hlm-dialog-header class="gap-1.5 text-center sm:text-center">
    <h2 hlmDialogTitle class="text-xl font-bold">{{ title() }}</h2>
    @if (description()) {
      <p hlmDialogDescription class="text-muted-foreground">{{ description() }}</p>
    }
  </hlm-dialog-header>
</div>

<hlm-dialog-footer class="mt-2 sm:justify-center">
  <button
    hlmBtn
    type="button"
    [variant]="confirmVariant()"
    [class]="confirmButtonClass()"
    (click)="dismiss()"
  >
    {{ confirmLabel() }}
  </button>
</hlm-dialog-footer>
